<script>
(function(){
var root=document.querySelector('.ssc'); if(!root) return;
var PIN_DISTANCE='+=135%', SCRUB=0.5, SLIDE_DUR=0.9, SLIDE_EASE='power3.out', GO_THROTTLE=220;
var BASE='https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/';
function load(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.async=false;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
(window.gsap?Promise.resolve():load(BASE+'gsap.min.js'))
.then(function(){return window.ScrollTrigger?null:load(BASE+'ScrollTrigger.min.js');})
.then(init).catch(function(e){console.warn('[ssc] GSAP failed to load',e);root.classList.add('ssc-ready');});
function init(){
gsap.registerPlugin(ScrollTrigger);
ScrollTrigger.config({ignoreMobileResize:true});
var stage=root.querySelector('.ssc-stage');
var slots=Array.prototype.slice.call(root.querySelectorAll('.ssc-slot'));
var heroCopy=root.querySelector('.ssc-hero-copy');
var prevBtn=root.querySelector('.ssc-arrow--prev'), nextBtn=root.querySelector('.ssc-arrow--next');
var N=slots.length; if(!N) return;
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var params=new URLSearchParams(location.search);
var debugP=params.has('p')?parseFloat(params.get('p')):null;
var debugEl=document.getElementById('ssc-debug'); if(debugEl&&(params.has('debug')||debugP!==null)) debugEl.hidden=false;
var COLOR=/^(#([0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})|rgba?\([^)]*\))$/i;
function readColor(card,sel,attr){var el=card.querySelector(sel);var v=(card.getAttribute(attr)||(el?el.textContent:'')||'').trim();return COLOR.test(v)?v:null;}
var active=-1;
slots.forEach(function(slot,i){
var card=slot.querySelector('.ssc-card')||slot;
var a=readColor(card,'.ssc-card__meta-accent','data-accent'), t=readColor(card,'.ssc-card__meta-cta','data-cta-text');
if(a) card.style.setProperty('--accent',a);
if(t) card.style.setProperty('--cta-text',t);
var c=card.getAttribute('data-current'), pill=card.querySelector('.ssc-pill'), pillText=pill?pill.querySelector('.ssc-pill__text'):null;
var hasPill=!!(pill&&!pill.classList.contains('w-condition-invisible')&&(pillText?(pillText.textContent.trim()&&!pillText.classList.contains('w-dyn-bind-empty')):pill.textContent.trim()));
if(pill&&!hasPill) pill.classList.add('ssc-pill--empty');
var isCurrent=(c&&/^(true|1|on|yes)$/i.test(c.trim()))||hasPill;
if(isCurrent&&active<0) active=i;
});
if(active<0){active=parseInt(root.getAttribute('data-start'),10); if(isNaN(active)||active>=N) active=Math.min(1,N-1);}
var pos={v:active}, target=active;
function gapPx(){return parseFloat(getComputedStyle(root).getPropertyValue('--ssc-gap'))||16;}
function step(){var w=0; for(var k=0;k<slots.length;k++){ if(slots[k].offsetWidth>w) w=slots[k].offsetWidth; } if(!w){ var pct=parseFloat(getComputedStyle(root).getPropertyValue('--ssc-card-pct'))||86; w=stage.clientWidth*pct/100; } return w+gapPx();}
function wrap(d){d=((d%N)+N)%N; if(d>N/2) d-=N; return d;}
function offsetOf(i){var d=wrap(i-active); return d===0?0:(d===1?1:(d===-1?-1:null));}
function setRole(slot,o){
slot.classList.toggle('ssc-active',o===0); slot.classList.toggle('ssc-left',o===-1);
slot.classList.toggle('ssc-right',o===1); slot.classList.toggle('ssc-off',o===null);
if(o===null) slot.setAttribute('aria-hidden','true'); else slot.removeAttribute('aria-hidden');
}
function render(){var S=step(); slots.forEach(function(slot,i){gsap.set(slot,{x:wrap(i-pos.v)*S});});}
function applyRoles(){slots.forEach(function(slot,i){setRole(slot,offsetOf(i));});}
function layout(){gsap.killTweensOf(pos); pos.v=target; render(); applyRoles();}
var lastGo=-1e9;
function go(dir){
if(!root.classList.contains('ssc-ready')) return;
var now=performance.now(); if(now-lastGo<GO_THROTTLE) return; lastGo=now;
target+=dir; active=((target%N)+N)%N; applyRoles();
gsap.to(pos,{v:target,duration:reduce?0:SLIDE_DUR,ease:SLIDE_EASE,overwrite:true,onUpdate:render});
}
layout();
if(params.has('debug')) window.__ssc={go:go,layout:layout,slots:slots,state:function(){return {active:active,target:target,pos:pos.v};}};
var suppressClickUntil=0;
if(prevBtn) prevBtn.addEventListener('click',function(e){e.preventDefault();go(-1);});
if(nextBtn) nextBtn.addEventListener('click',function(e){e.preventDefault();go(1);});
slots.forEach(function(slot){ slot.addEventListener('click',function(e){
if(performance.now()<suppressClickUntil) return;
if(slot.classList.contains('ssc-left')){e.preventDefault();go(-1);} else if(slot.classList.contains('ssc-right')){e.preventDefault();go(1);} }); });
window.addEventListener('keydown',function(e){
if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight') return;
var r=root.getBoundingClientRect(); if(r.top>innerHeight*0.5||r.bottom<innerHeight*0.5) return;
go(e.key==='ArrowRight'?1:-1);
});
var px=null,py=null;
stage.addEventListener('pointerdown',function(e){px=e.clientX;py=e.clientY;});
stage.addEventListener('pointerup',function(e){ if(px===null) return; var dx=e.clientX-px, dy=e.clientY-py; px=py=null;
if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.2){ suppressClickUntil=performance.now()+400; go(dx<0?1:-1); } });
if(reduce){
gsap.set(root,{'--t-shape':1,'--t-content':1,'--t-shade':1,'--t-sides':1,'--t-ui':1});
if(heroCopy) gsap.set(heroCopy,{autoAlpha:0});
root.classList.add('ssc-ready');
}else{
if(heroCopy) gsap.set(heroCopy,{opacity:1,y:0,filter:'blur(0px)'});
var tl=gsap.timeline({scrollTrigger:{trigger:root,start:'top top',end:PIN_DISTANCE,pin:true,anticipatePin:1,scrub:debugP!==null?true:SCRUB,
onUpdate:function(self){root.classList.toggle('ssc-ready',self.progress>0.88);
if(debugEl&&!debugEl.hidden) debugEl.textContent='transition '+(self.progress*100).toFixed(1)+'%  ·  '+innerWidth+'×'+innerHeight;}}});
if(heroCopy) tl.to(heroCopy,{opacity:0,y:-56,filter:'blur(10px)',duration:.28,ease:'power1.in'},0);
tl.to(root,{'--t-shape':1,duration:.62,ease:'power2.inOut'},.04)
.to(root,{'--t-content':1,duration:.20,ease:'power1.out'},.52)
.to(root,{'--t-shade':1,duration:.36,ease:'sine.inOut'},.42)
.to(root,{'--t-sides':1,duration:.26,ease:'power2.out'},.66)
.to(root,{'--t-ui':1,duration:.14,ease:'power1.out'},.78)
.to({},{duration:.06});
if(debugP!==null){ var st=tl.scrollTrigger; var apply=function(){ScrollTrigger.refresh(); window.scrollTo(0,st.start+debugP*(st.end-st.start)); ScrollTrigger.update();}; window.addEventListener('load',function(){apply(); setTimeout(apply,50);}); }
}
var lastW=innerWidth,rt;
window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(Math.abs(innerWidth-lastW)<2)return;lastW=innerWidth;layout();},150);});
}
})();
</script>
<script>
(function(){
var root=document.querySelector('.dv'); if(!root) return;
var track=root.querySelector('.dv-track'), prev=root.querySelector('.dv-arrow--prev'), next=root.querySelector('.dv-arrow--next');
if(!track) return;
var coarse=window.matchMedia('(hover:none)').matches;
function slot(){return root.querySelector('.dv-slot');}
function step(){var s=slot(); if(!s) return 436; var cs=getComputedStyle(s.parentNode); return s.getBoundingClientRect().width+(parseFloat(cs.columnGap)||parseFloat(cs.gap)||16);}
function padLeft(){return parseFloat(getComputedStyle(track).scrollPaddingLeft)||0;}
function perClick(){var vis=Math.floor((track.clientWidth-padLeft())/step()); return Math.max(1,Math.min(2,vis));}
function go(dir){track.scrollBy({left:dir*perClick()*step(),behavior:'smooth'});}
function updateArrows(){var max=track.scrollWidth-track.clientWidth-1, x=track.scrollLeft;
if(prev) prev.setAttribute('aria-disabled',x<=1?'true':'false'); if(next) next.setAttribute('aria-disabled',x>=max?'true':'false');}
if(prev) prev.addEventListener('click',function(e){e.preventDefault();go(-1);});
if(next) next.addEventListener('click',function(e){e.preventDefault();go(1);});
var raf; track.addEventListener('scroll',function(){cancelAnimationFrame(raf);raf=requestAnimationFrame(updateArrows);},{passive:true});
window.addEventListener('resize',updateArrows); updateArrows(); setTimeout(updateArrows,400);
function cards(){return Array.prototype.slice.call(root.querySelectorAll('.dv-card'));}
function closeAll(except){cards().forEach(function(c){if(c!==except) c.classList.remove('dv-open');});}
function toggle(card){var open=!card.classList.contains('dv-open'); closeAll(card); card.classList.toggle('dv-open',open);}
root.addEventListener('click',function(e){
var info=e.target.closest('.dv-card__info'), card=e.target.closest('.dv-card');
if(info&&card){e.preventDefault(); toggle(card); return;}
if(card&&coarse){toggle(card);}
});
document.addEventListener('click',function(e){ if(!e.target.closest('.dv-card')) closeAll(null); });
root.addEventListener('keydown',function(e){
if(e.key==='Escape'){closeAll(null); return;}
if(!e.target.closest('.dv-arrow,.dv-card,.dv-card__info')) return;
if(e.key==='ArrowRight'){e.preventDefault();go(1);} else if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
});
})();
</script>
