<style>
.ssc{--ssc-card-pct:86;--ssc-gap:16px;--ssc-radius:32px;--ssc-side-shift:72px;--ssc-peek-dim:.22;--ssc-shade:.84;--ssc-vh:1vh;

.ssc-track .w-dyn-list,.ssc-track .w-dyn-items{position:absolute;top:0;right:0;bottom:0;left:0}

.ssc-slot.ssc-right{--dir:1}

.ssc-slot.ssc-active .ssc-card{--card-scale:calc(1 + (var(--ssc-hero-scale) - 1) * (1 - var(--t-shape)));border-radius:calc(var(--ssc-radius) * var(--t-shape))}
.ssc-slot:not(.ssc-active) .ssc-card{opacity:var(--t-sides)}

.ssc-slot.ssc-active .ssc-card__shade{opacity:var(--t-shade)}

.ssc-slot.ssc-active .ssc-card::after{opacity:var(--t-shape)}

<style>
.dv-track{overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-padding-left:80px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.dv-track::-webkit-scrollbar{display:none}
.dv-slot{scroll-snap-align:start}
.dv-card__content{pointer-events:none}
.dv-card__title{position:relative}
.dv-card__frost,.dv-card__sub,.dv-card__desc{transition:opacity .55s cubic-bezier(.2,.6,.2,1),transform .55s cubic-bezier(.2,.6,.2,1)}
.dv-card__desc{transform:translateY(10px)}
.dv-card.dv-open .dv-card__frost{opacity:1}
.dv-card.dv-open .dv-card__sub{opacity:0;transform:translateY(-6px)}
.dv-card.dv-open .dv-card__desc{opacity:1;transform:none}
@media (hover:hover){
.dv-card:hover .dv-card__frost{opacity:1}
.dv-card:hover .dv-card__sub{opacity:0;transform:translateY(-6px)}
.dv-card:hover .dv-card__desc{opacity:1;transform:none}
}
@media (hover:none){.dv-card__info{display:flex}}
.dv-card:focus-visible{outline:none}
.dv-card:focus-visible .dv-card__frost{opacity:1}
.dv-card:focus-visible .dv-card__sub{opacity:0;transform:translateY(-6px)}
.dv-card:focus-visible .dv-card__desc{opacity:1;transform:none}
.dv-card__info-icon::before,.dv-card__info-icon::after{content:'';position:absolute;left:50%;top:50%;width:14px;height:2px;margin:-1px 0 0 -7px;background:#000;border-radius:1px;transition:transform .45s cubic-bezier(.2,.6,.2,1)}
.dv-card__info-icon::after{transform:rotate(90deg)}
.dv-card.dv-open .dv-card__info-icon::before{transform:rotate(45deg)}
.dv-card.dv-open .dv-card__info-icon::after{transform:rotate(135deg)}
.dv-arrow[aria-disabled="true"]{opacity:.35;pointer-events:none}
.dv-arrow:active,.dv-cta:active{transform:scale(.96)}
@media screen and (max-width:991px){.dv-track{scroll-padding-left:48px}}
@media screen and (max-width:767px){.dv-track{scroll-padding-left:24px}}
@media (prefers-reduced-motion:reduce){.dv-card__frost,.dv-card__sub,.dv-card__desc,.dv-card__info-icon::before,.dv-card__info-icon::after{transition:none}}
</style>
<style>

.wyp-item__body{transition:grid-template-rows .6s cubic-bezier(.2,.6,.2,1)}

.wyp-item.wyp-open .wyp-item__chev{transform:rotate(-135deg);margin:8px 8px 0 0}
.wyp-item__head:focus-visible{outline:2px solid #fff;outline-offset:4px;border-radius:4px}
.wyp-cta:active,.wyp-btn:active{transform:scale(.96)}

.wyp.wyp-video-on .wyp-video{opacity:1}
.wyp-ctl-bar{position:sticky;bottom:24px;height:0;z-index:3;pointer-events:none}
.wyp-toggle{position:absolute;right:24px;bottom:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;padding:0;margin:0;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:rgba(0,0,0,.3);color:#fff;cursor:pointer;pointer-events:auto;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);-webkit-tap-highlight-color:transparent;opacity:0;visibility:hidden;transition:opacity .4s ease,visibility .4s,background-color .2s ease,transform .15s ease-out}

.wyp.wyp-paused .wyp-toggle .wyp-toggle__pause{display:none}

@media (prefers-reduced-motion:reduce){.wyp-item__body,.wyp-item__panel,.wyp-item__chev{transition:none}}
</style>
