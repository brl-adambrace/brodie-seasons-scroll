<!-- Ways to Play · behaviour layer (page head): accordion motion, chevron, sticky video sizing, deferred video fade-in, pause control -->
<style>
@supports (height:1svh){.wyp{min-height:100svh}.wyp-video-wrap{height:100svh}.wyp-inner{min-height:100svh}}
.wyp-item__body{transition:grid-template-rows .6s cubic-bezier(.2,.6,.2,1)}
.wyp-item.wyp-open .wyp-item__body{grid-template-rows:1fr}
.wyp-item__panel{opacity:0;transform:translateY(6px);transition:opacity .45s cubic-bezier(.2,.6,.2,1) .05s,transform .45s cubic-bezier(.2,.6,.2,1) .05s}
.wyp-item.wyp-open .wyp-item__panel{opacity:1;transform:none}
.wyp-item__chev{transition:transform .5s cubic-bezier(.2,.6,.2,1),margin .5s cubic-bezier(.2,.6,.2,1)}
.wyp-item.wyp-open .wyp-item__chev{transform:rotate(-135deg);margin:8px 8px 0 0}
.wyp-item__head:focus-visible{outline:2px solid #fff;outline-offset:4px;border-radius:4px}
.wyp-cta:active,.wyp-btn:active{transform:scale(.96)}
/* video: hidden until the whole file is downloaded and parked on the poster frame, then cross-fades in */
.wyp-video{opacity:0;transition:opacity .8s ease}
.wyp.wyp-video-on .wyp-video{opacity:1}
/* pause / play control (created by the footer script): a zero-height sticky bar at the end of the section keeps the
   button pinned to the viewport corner while the section is on screen, above the content layer */
.wyp-ctl-bar{position:sticky;bottom:24px;height:0;z-index:3;pointer-events:none}
.wyp-toggle{position:absolute;right:24px;bottom:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;padding:0;margin:0;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:rgba(0,0,0,.3);color:#fff;cursor:pointer;pointer-events:auto;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);-webkit-tap-highlight-color:transparent;opacity:0;visibility:hidden;transition:opacity .4s ease,visibility .4s,background-color .2s ease,transform .15s ease-out}
.wyp.wyp-ctl .wyp-toggle{opacity:1;visibility:visible}
.wyp-toggle:hover{background:rgba(0,0,0,.5)}
.wyp-toggle:active{transform:scale(.94)}
.wyp-toggle:focus-visible{outline:2px solid #fff;outline-offset:3px}
.wyp-toggle svg{width:20px;height:20px;display:block;fill:currentColor}
.wyp-toggle .wyp-toggle__play{display:none}
.wyp.wyp-paused .wyp-toggle .wyp-toggle__play{display:block}
.wyp.wyp-paused .wyp-toggle .wyp-toggle__pause{display:none}
@media (max-width:767px){.wyp-ctl-bar{bottom:16px}.wyp-toggle{right:16px;width:40px;height:40px}.wyp-toggle svg{width:18px;height:18px}}
@media (prefers-reduced-motion:reduce){.wyp-item__body,.wyp-item__panel,.wyp-item__chev{transition:none}}
</style>
