<!-- Ways to Play · behaviour layer (page head): sticky video sizing, mobile scroll variant, deferred video fade-in, pause control -->
<style>
@supports (height:1svh){.wyp{min-height:100svh}.wyp-video-wrap{height:100svh}.wyp-inner{min-height:100svh}}
.wyp-cta:active,.wyp-card__btn:active{transform:scale(.96)}
/* mobile: the cards are a horizontal, snapping row that runs edge to edge (Adam's pick); the row bleeds through the
   24px side padding with width:auto so it is not clipped at the column's content box. Add the combo class wyp--stack
   to the section to fall back to the stacked single column instead. */
@media (max-width:767px){
.wyp:not(.wyp--stack) .wyp-cards{display:flex;flex-direction:row;align-items:stretch;gap:12px;width:auto;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:24px;margin:0 -24px;padding:0 24px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.wyp:not(.wyp--stack) .wyp-cards::-webkit-scrollbar{display:none}
.wyp:not(.wyp--stack) .wyp-card{flex:0 0 78vw;min-height:0;scroll-snap-align:start}
}
/* video: hidden until the whole file is downloaded and parked on the poster frame, then cross-fades in */
.wyp-video{opacity:0;transition:opacity .8s ease}
.wyp.wyp-video-on .wyp-video{opacity:1}
/* pause / play control (created by the footer script): a zero-height sticky bar at the end of the section keeps the
   button pinned to the viewport corner while the section is on screen, above the content layer. Bottom-LEFT because the
   site's Intercom launcher owns the bottom-right corner. */
.wyp-ctl-bar{position:sticky;bottom:24px;height:0;z-index:3;pointer-events:none}
.wyp-toggle{position:absolute;left:24px;bottom:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;padding:0;margin:0;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:rgba(0,0,0,.3);color:#fff;cursor:pointer;pointer-events:auto;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);-webkit-tap-highlight-color:transparent;opacity:0;visibility:hidden;transition:opacity .4s ease,visibility .4s,background-color .2s ease,transform .15s ease-out}
.wyp.wyp-ctl .wyp-toggle{opacity:1;visibility:visible}
.wyp-toggle:hover{background:rgba(0,0,0,.5)}
.wyp-toggle:active{transform:scale(.94)}
.wyp-toggle:focus-visible{outline:2px solid #fff;outline-offset:3px}
.wyp-toggle svg{width:20px;height:20px;display:block;fill:currentColor}
.wyp-toggle .wyp-toggle__play{display:none}
.wyp.wyp-paused .wyp-toggle .wyp-toggle__play{display:block}
.wyp.wyp-paused .wyp-toggle .wyp-toggle__pause{display:none}
@media (max-width:767px){.wyp-ctl-bar{bottom:16px}.wyp-toggle{left:16px;width:40px;height:40px}.wyp-toggle svg{width:18px;height:18px}}
</style>
