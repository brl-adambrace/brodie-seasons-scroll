<!-- Seasons hero → carousel · behaviour layer. Static/visual styles live on the Webflow classes; this block only adds what the Designer can't express (custom properties, calc() transforms, keyframes). -->
<style>
.ssc{--ssc-card-pct:86;--ssc-gap:16px;--ssc-radius:32px;--ssc-side-shift:72px;--ssc-peek-dim:.22;--ssc-shade:.84;--ssc-vh:1vh;
  --ssc-hero-scale:calc(100 / var(--ssc-card-pct));--ssc-card-w:calc(var(--ssc-card-pct) * 1vw);--ssc-card-h:calc(var(--ssc-card-pct) * var(--ssc-vh));
  --t-shape:0;--t-content:0;--t-shade:0;--t-sides:0;--t-ui:0}
@supports (height:1svh){.ssc{--ssc-vh:1svh}}
.ssc-stage{height:calc(100 * var(--ssc-vh))}
.ssc-track .w-dyn-list,.ssc-track .w-dyn-items{position:absolute;top:0;right:0;bottom:0;left:0}
.ssc-slot{width:var(--ssc-card-w);height:var(--ssc-card-h);margin:calc(var(--ssc-card-h) / -2) 0 0 calc(var(--ssc-card-w) / -2);will-change:transform}
.ssc-slot.is-left{--dir:-1}
.ssc-slot.is-right{--dir:1}
.ssc.is-ready .ssc-slot:not(.is-active){cursor:pointer}
.ssc-card{transform:translate3d(calc(var(--dir,0) * var(--ssc-side-shift) * (1 - var(--t-sides))),0,0) scale(var(--card-scale,1));transform-origin:50% 50%}
.ssc-slot.is-active .ssc-card{--card-scale:calc(1 + (var(--ssc-hero-scale) - 1) * (1 - var(--t-shape)));border-radius:calc(var(--ssc-radius) * var(--t-shape))}
.ssc-slot:not(.is-active) .ssc-card{opacity:var(--t-sides)}
.ssc-card__shade{background:linear-gradient(180deg,rgba(0,0,0,0) 32%,rgba(0,0,0,calc(var(--ssc-shade) * .3)) 50%,rgba(0,0,0,calc(var(--ssc-shade) * .74)) 68%,rgba(0,0,0,var(--ssc-shade)) 90%,rgba(0,0,0,var(--ssc-shade)) 100%)}
.ssc-slot.is-active .ssc-card__shade{opacity:var(--t-shade)}
.ssc-slot:not(.is-active) .ssc-card__dim{opacity:var(--ssc-peek-dim)}
.ssc-card::after{content:'';position:absolute;top:0;right:0;bottom:0;left:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.ssc-slot.is-active .ssc-card::after{opacity:var(--t-shape)}
.ssc-slot.is-active .ssc-card__content{opacity:var(--t-content);transform:translate3d(0,calc(18px * (1 - var(--t-content))),0)}
.ssc-card__sub{color:var(--accent)}
.ssc-pill__dot{background-color:var(--accent);animation:ssc-dot-breathe 2s cubic-bezier(.45,0,.55,1) infinite}
@keyframes ssc-dot-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.ssc-cta{background-color:var(--accent);color:var(--cta-text)}
.ssc-slot:not(.is-active) .ssc-cta{pointer-events:none}
.ssc-arrow{opacity:var(--t-ui);pointer-events:none}
.ssc.is-ready .ssc-arrow{pointer-events:auto}
.ssc-arrow--prev{left:calc(50% - var(--ssc-card-w) / 2 - var(--ssc-gap) / 2 - 28px)}
.ssc-arrow--next{left:calc(50% + var(--ssc-card-w) / 2 + var(--ssc-gap) / 2 - 28px)}
@media screen and (max-width:991px){.ssc{--ssc-side-shift:56px}.ssc-arrow--prev{left:calc(50% - var(--ssc-card-w) / 2 - var(--ssc-gap) / 2 - 24px)}.ssc-arrow--next{left:calc(50% + var(--ssc-card-w) / 2 + var(--ssc-gap) / 2 - 24px)}}
@media screen and (max-width:767px){.ssc{--ssc-card-pct:88;--ssc-gap:12px;--ssc-radius:24px;--ssc-side-shift:40px}}
@media screen and (max-height:640px){.ssc-hero-copy{padding-top:52px}.ssc-hero-copy__title,.ssc-hero-copy__title2,.ssc-card__title{font-size:40px;letter-spacing:-1.2px}.ssc-card__sub{font-size:22px}.ssc-card__badge{width:64px;height:64px}}
@media (prefers-reduced-motion:reduce){.ssc{--t-shape:1;--t-content:1;--t-shade:1;--t-sides:1;--t-ui:1}.ssc-hero-copy{display:none}.ssc-card__dim,.ssc-arrow,.ssc-cta{transition:none}.ssc-pill__dot{animation:none}}
</style>
