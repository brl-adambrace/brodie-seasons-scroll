<!-- Ways to Play · accordion + background video (page footer).
     Accordion: one item open at a time; Enter/Space toggle.
     Video: nothing downloads until the page has loaded and the section is within half a viewport. The best-fitting
     encode (720p on phones, HEVC where the browser can decode it) is fetched in full, parked on the poster frame
     (data-start = the poster's timestamp) and cross-faded in, then plays. A pause/play control is added in a
     sticky bar at the end of the section (so it sits in the viewport corner above the content); it doubles as an opt-in for reduced-motion / data-saver visitors, who only get the poster. -->
<script>
(function(){
  var root=document.querySelector('.wyp'); if(!root) return;
  var items=Array.prototype.slice.call(root.querySelectorAll('.wyp-item'));
  function setOpen(item,open){ item.classList.toggle('wyp-open',open); var h=item.querySelector('.wyp-item__head'); if(h) h.setAttribute('aria-expanded',open?'true':'false'); }
  function toggle(item){ var open=!item.classList.contains('wyp-open'); items.forEach(function(it){ if(it!==item) setOpen(it,false); }); setOpen(item,open); }
  items.forEach(function(item){
    var head=item.querySelector('.wyp-item__head'); if(!head) return;
    setOpen(item,item.classList.contains('wyp-open'));
    head.addEventListener('click',function(e){ e.preventDefault(); toggle(item); });
    head.addEventListener('keydown',function(e){ if(e.key===' '||e.key==='Spacebar'){ e.preventDefault(); toggle(item); } });
  });

  var video=root.querySelector('.wyp-video'), wrap=root.querySelector('.wyp-video-wrap'); if(!video||!wrap) return;
  var d=video.dataset, start=parseFloat(d.start)||0;
  var conn=navigator.connection||{}, saveData=!!conn.saveData||/(^|-)2g$/.test(conn.effectiveType||'');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var small=window.matchMedia('(max-width: 767px)').matches;
  var hevc=!!video.canPlayType&&video.canPlayType('video/mp4; codecs="hvc1.1.6.L93.B0"')==='probably';
  var url=small?((hevc&&d.srcSmHevc)||d.srcSm||d.src):((hevc&&d.srcHevc)||d.src); if(!url) return;
  var state='idle', userPaused=false, inView=false, shown=false;
  video.muted=true; video.loop=true;

  var btn=document.createElement('button'); btn.type='button'; btn.className='wyp-toggle';
  btn.innerHTML='<svg class="wyp-toggle__pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg><svg class="wyp-toggle__play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.6v12.8a1 1 0 0 0 1.53.85l10.2-6.4a1 1 0 0 0 0-1.7L9.53 4.75A1 1 0 0 0 8 5.6z"/></svg>';
  var bar=document.createElement('div'); bar.className='wyp-ctl-bar'; bar.appendChild(btn); root.appendChild(bar);
  function setPaused(p){ root.classList.toggle('wyp-paused',p); btn.setAttribute('aria-label',p?'Play background video':'Pause background video'); btn.setAttribute('aria-pressed',p?'true':'false'); }
  setPaused(false);

  function play(){ if(userPaused||!inView||state!=='ready') return; var p=video.play(); if(p&&p.catch) p.catch(function(){}); }
  function show(){ if(shown) return; shown=true; root.classList.add('wyp-video-on'); root.classList.add('wyp-ctl'); setTimeout(play,750); } // fade over the identical frame, then move
  function ready(){
    if(state!=='loading') return; state='ready';
    var t=setTimeout(show,1500); video.addEventListener('seeked',function(){ clearTimeout(t); show(); },{once:true});
    if(start>0&&start<(video.duration||1e9)){ try{ video.currentTime=start; }catch(e){ clearTimeout(t); show(); } } else { clearTimeout(t); show(); }
  }
  function attach(src){ video.src=src; video.load(); }
  function load(){
    if(state!=='idle') return; state='loading';
    video.addEventListener('canplaythrough',ready,{once:true});
    video.addEventListener('error',function(){ state='failed'; root.classList.remove('wyp-ctl'); });
    var fallback=function(){ video.preload='auto'; attach(url); };
    if(window.fetch&&window.URL&&URL.createObjectURL){
      fetch(url,{mode:'cors',credentials:'omit'}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.blob(); })
        .then(function(b){ attach(URL.createObjectURL(b)); }).catch(fallback);
    } else fallback();
  }

  btn.addEventListener('click',function(){
    if(state==='ready'&&!video.paused){ userPaused=true; video.pause(); setPaused(true); return; }
    userPaused=false; setPaused(false); inView=true;
    if(state==='idle') load(); else play();
  });

  if(reduce||saveData){ userPaused=true; setPaused(true); root.classList.add('wyp-ctl'); } // poster only until the visitor opts in
  function watch(){
    if(!('IntersectionObserver' in window)){ inView=true; if(!userPaused) load(); return; }
    new IntersectionObserver(function(es){ es.forEach(function(e){
      inView=e.isIntersecting;
      if(inView){ if(state==='idle'){ if(!userPaused) load(); } else play(); }
      else if(state==='ready'&&!video.paused) video.pause();
    }); },{rootMargin:'50% 0px'}).observe(root);
  }
  if(document.readyState==='complete') watch(); else window.addEventListener('load',watch);
})();
</script>
